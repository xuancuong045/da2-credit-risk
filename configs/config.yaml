project: da2-credit-risk
seed: 42

paths:
  raw: data/raw
  processed: data/processed
  depth0: data/processed/depth0.parquet

columns:
  id: case_id
  target: target
  time: [date_decision, WEEK_NUM]

# Mốc chia tập theo WEEK_NUM (bao gồm cả hai đầu)
split:
  train: [0, 43]    # 01/01/2019 - 04/11/2019
  valid: [44, 51]   # 05/11/2019 - 30/12/2019
  calib: [52, 55]   # 31/12/2019 - 27/01/2020
  oot1:  [56, 61]   # 28/01/2020 - 09/03/2020
  oot2:  [62, 91]   # 10/03/2020 - 05/10/2020

champion:
  iv_min: 0.02
  # Scaling scorecard: Score = Offset + Factor * ln(Odds), Odds = good:bad
  # Factor = pdo / ln(2); Offset = score_ref - Factor * ln(odds_ref)
  # Chỉ đổi thang điểm hiển thị, không ảnh hưởng Gini/KS hay thứ hạng khách hàng
  scorecard:
    pdo: 20          # +20 điểm = odds good:bad gấp đôi
    score_ref: 600   # điểm tham chiếu
    odds_ref: 50     # odds good:bad = 50:1 tại score_ref

challenger:
  scale_pos_weight_init: 30.8   # (1 - 0.0314) / 0.0314
  top_k_features: [200, 300]
  max_gini_gap: null            # chốt ở W6 sau khi có LightGBM baseline

conformal:
  method: mondrian
  alpha: 0.1                    # coverage mục tiêu 90%; thí nghiệm chạy thêm 0.05 và 0.2
  alpha_grid: [0.05, 0.1, 0.2]

monitoring:
  psi_thresholds: [0.1, 0.25]
